# Fragment per a nginx: publica la web de CC Mallorca a /ccmallorca/
#
# Enganxa aquestes linies DINS del bloc 'server { ... }' del fitxer
# /etc/nginx/sites-available/quadern-estiu i despres recarrega nginx:
#
#     sudo nginx -t && sudo systemctl reload nginx

location = /ccmallorca { return 301 /ccmallorca/; }

location /ccmallorca/ {
    proxy_pass http://127.0.0.1:5002/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Imprescindible: sense aixo nginx rebutja les fotos (per defecte 1 MB)
    client_max_body_size 12M;
    proxy_read_timeout 60s;
}
