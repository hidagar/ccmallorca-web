# El fa servir cPanel (Git™ Version Control -> "Deploy HEAD Commit"):
# copia la web a la carpeta del subdomini. Nomes AFEGEIX o SOBREESCRIU
# fitxers del codi: uploads/ (fotos del client) i les dades de
# ~/ccmallorca-data no es toquen mai.
#
# Si el subdomini te una altra carpeta (Dominios -> "Raíz del documento"),
# canvia DEPLOYPATH.
---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/beta.ccmallorca.net/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R public/. $DEPLOYPATH
    - /bin/cp content.default.json $DEPLOYPATH
